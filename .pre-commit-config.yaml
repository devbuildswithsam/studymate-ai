# Runs before every commit (SMA-19). Update versions with: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^backend/evals/documents/   # SMA-51: frozen eval PDFs (1–3.3 MB each)
      - id: detect-private-key      # blocks commits that contain private keys

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
