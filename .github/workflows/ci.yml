# CI (SMA-70): every push and pull request to main is checked on a clean Linux machine.
# Three jobs run side by side; the run is green only when all three pass.
# No secrets: tests use a fake AI provider, so no API key is ever needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the code; it can't push or change anything.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # No backend/.env exists here: the tests must pass on the default settings alone.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip # reuse downloaded packages between runs (keyed on the files below)
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests with coverage (fails below 70%)
        run: pytest --cov
      - name: Migrations on an empty database
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci-empty.db

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exactly as in package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure
